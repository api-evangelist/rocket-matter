        required: true
      summary: Get activity type id
      x-summary-source: derived
  /BillableActivity.svc/json/DeleteActivity:
    post:
      tags:
      - BillableActivity
      description: To delete a specific activity.
      operationId: DeleteActivity
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteActivityResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteActivityRequest'
        required: true
      summary: Delete activity
      x-summary-source: derived
  /BillableActivity.svc/json/GetActivitiesForMatter:
    post:
      tags:
      - BillableActivity
      description: See all billable activities for a specific matter.
      operationId: GetActivitiesForMatter
      responses:
