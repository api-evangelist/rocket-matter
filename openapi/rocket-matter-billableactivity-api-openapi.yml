openapi: 3.2.0
info:
  description: Welcome to the Rocket Matter API.
  version: '2.0'
  title: Rocket Matter Billable Activity API
  termsOfService: www.rocketmatter.com
  contact:
    email: developer@rocketmatter.com
  license:
    name: Rocket Matter
    url: www.rocketmatter.com
  x-logo:
    url: https://support.rocketmatter.com/wp-content/themes/rm-support/img/rm-logo.png
servers:
- url: https://<DOMAIN>/<INSTALL>/API_V2
tags:
- name: BillableActivity
  description: View, add, edit, and delete billable activities.
paths:
  /BillableActivity.svc/json/GetBillableActivities:
    post:
      tags:
      - BillableActivity
      description: Get billable activities for a user by ID.
      operationId: GetBillableActivities
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBillableActivitiesResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetBillableActivitiesRequest'
        required: true
      summary: Get billable activities
      x-summary-source: derived
  /BillableActivity.svc/json/GetFirmBalances:
    post:
      tags:
      - BillableActivity
      description: To get the various balances of pending billable activity for the firm.
      operationId: GetFirmBalances
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFirmBalancesResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetFirmBalancesRequest'
        required: true
      summary: Get firm balances
      x-summary-source: derived
  /BillableActivity.svc/json/SaveBillableTime:
    post:
      tags:
      - BillableActivity
      description: To create a new billable time activity (non-expense).
      operationId: SaveBillableTime
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveBillableTimeResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveBillableTimeRequest'
        required: true
      summary: Save billable time
      x-summary-source: derived
  /BillableActivity.svc/json/SaveExpense:
    post:
      tags:
      - BillableActivity
      description: To create a new billable expense activity.
      operationId: SaveExpense
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveExpenseResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveExpenseRequest'
        required: true
      summary: Save expense
      x-summary-source: derived
  /BillableActivity.svc/json/GetUnitsBilledForPeriod:
    post:
      tags:
      - BillableActivity
      description: Gets all the billable units for a user over a specific time period.
      operationId: GetUnitsBilledForPeriod
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUnitsBilledForPeriodResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetUnitsBilledForPeriodRequest'
        required: true
      summary: Get units billed for period
      x-summary-source: derived
  /BillableActivity.svc/json/GetUnitsBilledForFirm:
    post:
      tags:
      - BillableActivity
      description: Gets all the billable units for the entire firm over a specific time period.
      operationId: GetUnitsBilledForFirm
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUnitsBilledForPeriodResponse'
        '400':
          description: Internal server error
        '401':
