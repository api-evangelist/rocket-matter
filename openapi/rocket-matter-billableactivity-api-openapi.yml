      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetUnitsBilledForPeriodRequest'
        required: true
      summary: Get units billed for firm
      x-summary-source: derived
  /BillableActivity.svc/json/GetTimeExpense:
    post:
      tags:
      - BillableActivity
      description: Get a time or expense billable activity by ID.
      operationId: GetTimeExpense
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTimeExpenseResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetTimeExpenseRequest'
        required: true
      summary: Get time expense
      x-summary-source: derived
  /BillableActivity.svc/json/GetActivityTypeId:
    post:
      tags:
      - BillableActivity
      description: See the type of an activity.
      operationId: GetActivityTypeId
      responses:
        '200':
          description: Successfully processed request
          content:
