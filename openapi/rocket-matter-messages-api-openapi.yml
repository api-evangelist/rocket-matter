openapi: 3.2.0
info:
  description: Welcome to the Rocket Matter API.
  version: '2.0'
  title: Rocket Matter Messages API
  termsOfService: www.rocketmatter.com
  contact:
    email: developer@rocketmatter.com
  license:
    name: Rocket Matter
    url: www.rocketmatter.com
  x-logo:
    url: https://support.rocketmatter.com/wp-content/themes/rm-support/img/rm-logo.png
servers:
- url: https://<DOMAIN>/<INSTALL>/API_V2
tags:
- name: Messages
  description: Phone message operations.
paths:
  /Messages.svc/json/SavePhoneMessage:
    post:
      tags:
      - Messages
      description: Create or update a phone message activity.
      operationId: SavePhoneMessage
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavePhoneMessageResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePhoneMessageRequest'
        required: true
      summary: Save phone message
      x-summary-source: derived
  /Messages.svc/json/GetPhoneMessage:
    post:
      tags:
      - Messages
      description: View existing phone message(s).
      operationId: GetPhoneMessage
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPhoneMessageResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetPhoneMessageRequest'
        required: true
      summary: Get phone message
      x-summary-source: derived
components:
  schemas:
    PhoneMessage:
      type: object
      properties:
        CallerPhoneNumber:
          type: string
        CallerName:
          type: string
        IsRead:
          type: boolean
        Subject:
          type: string
        CallTakerId:
          type: integer
          format: int32
        CalleeId:
          type: integer
          format: int32
        CallerId:
          type: integer
          format: int32
        InvoiceId:
          type: integer
          format: int32
        ActivityId:
          type: integer
          format: int32
        ActivityTypeId:
          type: integer
          format: int32
        IsNoCharge:
          type: boolean
        NonBillable:
          type: boolean
        BillingDate:
          type: string
          format: date-time
        BillableUnits:
          type: number
          format: double
        TotalSeconds:
          type: integer
          format: int32
        IsLineItemOverride:
          type: boolean
        MatterId:
          type: integer
          format: int32
        Cost:
          type: number
          format: double
        Notes:
          type: string
        DocumentId:
          type: integer
          format: int32
        ID:
          type: integer
          format: int32
    GetPhoneMessageResponse:
      type: object
      properties:
        PhoneMessage:
          type: object
          $ref: '#/components/schemas/PhoneMessage'
        Success:
          type: boolean
        Message:
          type: string
        ErrorMessage:
          type: string
        ErrorNumber:
          type: integer
          format: int32
        FailedValidations:
          type: array
          items:
            $ref: '#/components/schemas/ValidationResult'
        Errors:
          type: array
          items:
            type: string
    CharacterValidationRule:
      type: object
      properties:
        ShouldMatch:
          type: boolean
        Message:
          type: string
        Regex:
          type: string
    GetPhoneMessageRequest:
      type: object
      properties:
        ActivityId:
          type: integer
          format: int32
    ValidationResult:
      type: object
      properties:
        MinValue:
          type: boolean
        MaxValue:
          type: boolean
        MinLength:
          type: boolean
        MaxLength:
          type: boolean
        Required:
          type: boolean
        PropertyDisplayName:
          type: string
        Precision:
          type: boolean
        ValueEntered:
          type: object
        Name:
          type: string
        ObjectName:
          type: string
        ExternalID:
          type: string
        MinValueMessage:
          type: string
        MaxValueMessage:
          type: string
        MinLengthMessage:
          type: string
        MaxLengthMessage:
          type: string
        RequiredMessage:
          type: string
        RequiredPrecisionMessage:
          type: string
        BaseFailureMessage:
          type: string
        FailedValidationMessages:
          type: array
          items:
            type: string
        FailedCharacterValidations:
          type: array
          items:
            $ref: '#/components/schemas/CharacterValidationRule'
        IsValid:
          type: boolean
    SavePhoneMessageResponse:
      type: object
      properties:
        PhoneMessage:
          type: object
          $ref: '#/components/schemas/PhoneMessage'
        Success:
          type: boolean
        Message:
          type: string
        ErrorMessage:
          type: string
        ErrorNumber:
          type: integer
          format: int32
        FailedValidations:
          type: array
          items:
            $ref: '#/components/schemas/ValidationResult'
        Errors:
          type: array
          items:
            type: string
    SavePhoneMessageRequest:
      type: object
      properties:
        PhoneMessage:
          type: object
          $ref: '#/components/schemas/PhoneMessage'
