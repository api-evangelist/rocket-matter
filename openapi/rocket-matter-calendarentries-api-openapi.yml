        Success:
          type: boolean
        Message:
          type: string
        ErrorMessage:
          type: string
        ErrorNumber:
          type: integer
          format: int32
        FailedValidations:
          type: array
          items:
            $ref: '#/components/schemas/ValidationResult'
        Errors:
          type: array
          items:
            type: string
    Event:
      type: object
      properties:
        ParentEventId:
          type: integer
          format: int32
        MatterID:
          type: integer
          format: int32
        MatterName:
          type: string
        Title:
          type: string
        Notes:
          type: string
        Location:
          type: string
        StartDateString:
          type: string
        StartDate:
          type: string
          format: date-time
        StartDay:
          type: string
        StartTime:
          type: string
        EndDay:
          type: string
        EndTime:
          type: string
        EndDateString:
          type: string
        EndDate:
          type: string
          format: date-time
        BillingDate:
          type: string
          format: date-time
        OwnerID:
          type: integer
          format: int32
