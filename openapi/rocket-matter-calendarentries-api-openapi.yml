            type: string
        Milestones:
          type: array
          items:
            $ref: '#/components/schemas/TaskEventMilestone'
        MatterTemplateMilestoneActionId:
          type: integer
          format: int32
        IsMilestonePending:
          type: boolean
        ActivityId:
          type: integer
          format: int32
        IsPrivate:
          type: boolean
        IsFlagged:
          type: boolean
        IsAllDayEvent:
          type: boolean
        IsRecurringEvent:
          type: boolean
        RemindParticipants:
          type: boolean
        ReminderInterval:
          type: integer
          format: int32
        RecurringFrequency:
          type: integer
          format: int32
        RecurringInterval:
          type: string
