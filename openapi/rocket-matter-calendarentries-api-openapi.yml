          - Weekday
          - Week
          - Month
          - Year
          - Custom
        RecurringEventEndType:
          type: string
          enum:
          - Never
          - After
          - 'On'
        ReminderIntervalType:
          type: string
          enum:
          - Minutes
          - Hours
          - Days
          - Months
        RecurringEventEndDate:
          type: string
          format: date-time
        ReminderDate:
          type: string
          format: date-time
        RecurringEventOccurences:
