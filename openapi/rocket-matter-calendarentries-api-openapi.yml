openapi: 3.2.0
info:
  description: Welcome to the Rocket Matter API.
  version: '2.0'
  title: Rocket Matter Calendar Entries API
  termsOfService: www.rocketmatter.com
  contact:
    email: developer@rocketmatter.com
  license:
    name: Rocket Matter
    url: www.rocketmatter.com
  x-logo:
    url: https://support.rocketmatter.com/wp-content/themes/rm-support/img/rm-logo.png
servers:
- url: https://<DOMAIN>/<INSTALL>/API_V2
tags:
- name: CalendarEntries
  description: View, create, and delete calendar events.
paths:
  /CalendarEntries.svc/json/GetUpcomingEventsForMatter:
    post:
      tags:
      - CalendarEntries
      description: Get all upcoming events for a specific matter.
      operationId: GetUpcomingEventsForMatter
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUpcomingEventsResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetUpcomingEventsForMatterRequest'
        required: true
      summary: Get upcoming events for matter
      x-summary-source: derived
  /CalendarEntries.svc/json/SyncEvents:
    post:
      tags:
      - CalendarEntries
      description: 'Sync event with the Rocket Matter Outlook plugin. Note: Only for desktop PC version of Microsoft Outlook.'
      operationId: SyncEvents
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncEventsResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncEventsRequest'
        required: true
      summary: Sync events
      x-summary-source: derived
  /CalendarEntries.svc/json/GetUpcomingEventsForUser:
    post:
      tags:
      - CalendarEntries
      description: Get all upcoming events for the current user.
      operationId: GetUpcomingEventsForUser
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUpcomingEventsResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetUpcomingEventsForUserRequest'
        required: true
      summary: Get upcoming events for user
      x-summary-source: derived
  /CalendarEntries.svc/json/SaveCalendarEntry:
    post:
      tags:
      - CalendarEntries
      description: Create a new calendar event.
      operationId: SaveCalendarEntry
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveCalendarEntryResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveCalendarEntryRequest'
        required: true
      summary: Save calendar entry
      x-summary-source: derived
  /CalendarEntries.svc/json/CheckContactAvailability:
    post:
      tags:
      - CalendarEntries
      description: Check a contact(s) calendar availability.
      operationId: CheckContactAvailability
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckContactAvailabilityResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckContactAvailabilityRequest'
        required: true
      summary: Check contact availability
      x-summary-source: derived
  /CalendarEntries.svc/json/GetCalendarEntry:
    post:
      tags:
      - CalendarEntries
      description: Get a specific calendar event based on ID.
      operationId: GetCalendarEntry
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCalendarEntryResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetCalendarEntryRequest'
        required: true
      summary: Get calendar entry
      x-summary-source: derived
  /CalendarEntries.svc/json/DeleteCalendarEntry:
    post:
      tags:
      - CalendarEntries
      description: Delete a specific calendar event, or series of recurring events.
      operationId: DeleteCalendarEntry
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCalendarEntryResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteCalendarEntryRequest'
        required: true
      summary: Delete calendar entry
      x-summary-source: derived
  /CalendarEntries.svc/json/GetCalendarEntriesForDateRange:
    post:
      tags:
      - CalendarEntries
      description: See user(s) calendar events for a specific date range and/or a specific matter.
      operationId: GetCalendarEntriesForDateRange
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCalendarEntriesForDateRangeResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetCalendarEntriesForDateRangeRequest'
        required: true
      summary: Get calendar entries for date range
      x-summary-source: derived
  /CalendarEntries.svc/json/GetCalendarEntriesDates:
    post:
      tags:
      - CalendarEntries
      description: Get all event dates for specific user(s).
      operationId: GetCalendarEntriesDates
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCalendarEntriesDatesResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetCalendarEntriesForDateRangeRequest'
        required: true
      summary: Get calendar entries dates
      x-summary-source: derived
components:
  schemas:
    GetCalendarEntriesForDateRangeRequest:
      type: object
      properties:
        UserIds:
          type: array
          items:
            type: integer
            format: int32
        FromDate:
          type: string
          format: date-time
        ToDate:
          type: string
          format: date-time
        MatterId:
          type: integer
          format: int32
    GetCalendarEntryRequest:
      type: object
      properties:
        ActivityId:
          type: integer
          format: int32
    CheckContactAvailabilityResponse:
      type: object
      properties:
        ContactIds:
          type: array
          items:
            type: integer
            format: int32
        Success:
          type: boolean
        Message:
          type: string
        ErrorMessage:
          type: string
        ErrorNumber:
          type: integer
          format: int32
        FailedValidations:
          type: array
          items:
            $ref: '#/components/schemas/ValidationResult'
        Errors:
          type: array
          items:
            type: string
    CheckContactAvailabilityRequest:
      type: object
      properties:
        ActivityId:
          type: integer
          format: int32
        StartDate:
          type: string
          format: date-time
        EndDate:
          type: string
