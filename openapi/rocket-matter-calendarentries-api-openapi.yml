        IsCourtRule:
          type: boolean
        MatterCourtRuleId:
          type: string
        ThirdPartyDeadlineId:
          type: string
        IsStatute:
          type: boolean
        EventUser:
          type: object
          $ref: '#/components/schemas/User'
