        GetFlagged:
          type: boolean
    GetUpcomingEventsResponse:
      type: object
      properties:
        Events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        MatterNameLookup:
          type: object
        Success:
          type: boolean
        Message:
          type: string
        ErrorMessage:
          type: string
        ErrorNumber:
          type: integer
          format: int32
        FailedValidations:
          type: array
          items:
            $ref: '#/components/schemas/ValidationResult'
        Errors:
          type: array
          items:
            type: string
    SaveCalendarEntryResponse:
      type: object
      properties:
        CalendarEntry:
          type: object
          $ref: '#/components/schemas/Event'
        Success:
          type: boolean
        Message:
          type: string
        ErrorMessage:
          type: string
        ErrorNumber:
          type: integer
