          application/json:
            schema:
              $ref: '#/components/schemas/GetChannelInfoRequest'
        required: true
      summary: Get channel info
      x-summary-source: derived
  /Communicator.svc/json/GetChannelsIBelongTo:
    post:
      tags:
      - Communicator
      description: Get a list of channels the request has is a member of.
      operationId: GetChannelsIBelongTo
