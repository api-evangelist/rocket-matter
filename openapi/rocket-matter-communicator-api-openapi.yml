openapi: 3.2.0
info:
  description: Welcome to the Rocket Matter API.
  version: '2.0'
  title: Rocket Matter Communicator API
  termsOfService: www.rocketmatter.com
  contact:
    email: developer@rocketmatter.com
  license:
    name: Rocket Matter
    url: www.rocketmatter.com
  x-logo:
    url: https://support.rocketmatter.com/wp-content/themes/rm-support/img/rm-logo.png
servers:
- url: https://<DOMAIN>/<INSTALL>/API_V2
tags:
- name: Communicator
paths:
  /Communicator.svc/json/DeleteChannel:
    post:
      tags:
      - Communicator
      description: Delete a previously created communicator channel. The account used to delete must have admin rights to delete the channel.
      operationId: DeleteChannel
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteChannelRequest'
        required: true
      summary: Delete channel
      x-summary-source: derived
  /Communicator.svc/json/SetEmailAlertReminder:
    post:
      tags:
      - Communicator
      description: Notify users of new messages over email. ** This method is now obsolete DO NOT USE.
      operationId: SetEmailAlertReminder
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetEmailAlertReminderRequest'
        required: true
      summary: Set email alert reminder
      x-summary-source: derived
  /Communicator.svc/json/DeleteMessage:
    post:
      tags:
      - Communicator
      description: Delete direct or channel messages by specifying the message Id. Only messages generated by the requester account can be deleted.
      operationId: DeleteMessage
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteMessageRequest'
        required: true
      summary: Delete message
      x-summary-source: derived
  /Communicator.svc/json/EditMessage:
    post:
      tags:
      - Communicator
      description: Alter the message text of a previously generated message.
      operationId: EditMessage
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditMessageRequest'
        required: true
      summary: Edit message
      x-summary-source: derived
  /Communicator.svc/json/MatterChannelSubscription:
    post:
      tags:
      - Communicator
      description: Subscribe or un-subscribe to matter channels.
      operationId: MatterChannelSubscription
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatterChannelSubscriptionRequest'
        required: true
      summary: Matter channel subscription
      x-summary-source: derived
  /Communicator.svc/json/GeFileUploadUrl:
    post:
      tags:
      - Communicator
      description: Get URLs to use for updating from JavaScript client.
      operationId: GeFileUploadUrl
      responses:
        '200':
