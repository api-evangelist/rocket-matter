        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadAllMessagesFromChannelRequest'
        required: true
      summary: Read all messages from channel
      x-summary-source: derived
  /Communicator.svc/json/GetUnreadChannelMessages:
    post:
      tags:
      - Communicator
      description: Get a list of all channels\counts for the requestor with unread messages.
