        Amount:
          type: number
          format: double
        AmountDue:
          type: number
          format: double
        AmountPaid:
          type: number
          format: double
        PaymentAmount:
          type: number
          format: double
        IsChanged:
          type: boolean
        MatterId:
          type: integer
          format: int32
        ID:
          type: integer
          format: int32
    GetMattersForInvoiceTemplateResponse:
