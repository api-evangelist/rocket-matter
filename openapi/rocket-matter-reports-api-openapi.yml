    RunReportRequest:
      type: object
      properties:
        Filter:
          type: object
          $ref: '#/components/schemas/ReportFilter'
    GetUserReportPreferenceResponse:
      type: object
      properties:
        Preference:
          type: object
          $ref: '#/components/schemas/UserReportPreference'
        Success:
          type: boolean
        Message:
          type: string
        ErrorMessage:
          type: string
        ErrorNumber:
          type: integer
          format: int32
        FailedValidations:
          type: array
          items:
            $ref: '#/components/schemas/ValidationResult'
        Errors:
          type: array
          items:
            type: string
    SaveUserReportPreferenceResponse:
      type: object
      properties:
        Preference:
          type: object
          $ref: '#/components/schemas/UserReportPreference'
        Success:
          type: boolean
        Message:
          type: string
        ErrorMessage:
          type: string
        ErrorNumber:
          type: integer
          format: int32
        FailedValidations:
          type: array
          items:
            $ref: '#/components/schemas/ValidationResult'
        Errors:
          type: array
          items:
            type: string
    GetUserReportPreferenceRequest:
      type: object
      properties:
        Preference:
