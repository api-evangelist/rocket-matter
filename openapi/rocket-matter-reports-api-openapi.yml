        PageSize:
          type: integer
          format: int32
        ReportDisplayName:
          type: string
        HasAccess:
          type: boolean
        UseWideScreen:
          type: boolean
        RunOnLoad:
          type: boolean
        SaveReportState:
          type: boolean
        HelpfullTips:
          type: string
        LoadSavedReportStateOnlyOnBack:
          type: boolean
        BreadCrumbs:
          type: array
          items:
            $ref: '#/components/schemas/BreadCrumb'
        DisableSort:
          type: boolean
        DisableSummary:
          type: boolean
        ID:
          type: integer
          format: int32
    GetReportSummaryResponse:
      type: object
      properties:
        Summary:
          type: object
        Success:
          type: boolean
        Message:
          type: string
        ErrorMessage:
          type: string
        ErrorNumber:
          type: integer
          format: int32
        FailedValidations:
          type: array
          items:
            $ref: '#/components/schemas/ValidationResult'
        Errors:
          type: array
          items:
            type: string
