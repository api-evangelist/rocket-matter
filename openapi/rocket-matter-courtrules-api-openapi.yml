openapi: 3.2.0
info:
  description: Welcome to the Rocket Matter API.
  version: '2.0'
  title: Rocket Matter Court Rules API
  termsOfService: www.rocketmatter.com
  contact:
    email: developer@rocketmatter.com
  license:
    name: Rocket Matter
    url: www.rocketmatter.com
  x-logo:
    url: https://support.rocketmatter.com/wp-content/themes/rm-support/img/rm-logo.png
servers:
- url: https://<DOMAIN>/<INSTALL>/API_V2
tags:
- name: CourtRules
paths:
  /CourtRules.svc/json/TriggerMockDeadlineUpdate:
    post:
      tags:
      - CourtRules
      description: Simulate court rule event change, this can be used to simulate email notifications when deadlines change in LawToolBox.
      operationId: TriggerMockDeadlineUpdate
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerMockDeadlineUpdateResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerMockDeadlineUpdateRequest'
        required: true
      summary: Trigger mock deadline update
      x-summary-source: derived
  /CourtRules.svc/json/GetMatterCourtRuleEvents:
    post:
      tags:
      - CourtRules
      description: Get remaining matter court rule events.
      operationId: GetMatterCourtRuleEvents
      responses:
        '200':
