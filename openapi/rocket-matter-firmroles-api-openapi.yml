        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveFirmRoleRequest'
        required: true
      summary: Save firm role
      x-summary-source: derived
  /FirmRoles.svc/json/DeleteFirmRole:
    post:
      tags:
      - FirmRoles
      description: Deletes firm role for user. Requires admin access and is an admin user.
      operationId: DeleteFirmRole
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteFirmRoleResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteFirmRoleRequest'
        required: true
      summary: Delete firm role
      x-summary-source: derived
  /FirmRoles.svc/json/FirmRolesRatesCanEdit:
    post:
      tags:
      - FirmRoles
      description: Returns value if user can edit firm role. Requires admin access and is an admin user.
      operationId: FirmRolesRatesCanEdit
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmRolesRatesCanEditResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirmRolesRatesCanEditRequest'
        required: true
      summary: Firm roles rates can edit
      x-summary-source: derived
  /FirmRoles.svc/json/GetClientRoleRates:
    post:
      tags:
      - FirmRoles
      description: Returns client role rates based on ContactId. Requires admin access and is an admin user.
      operationId: GetClientRoleRates
      responses:
        '200':
          description: Successfully processed request
          content:
