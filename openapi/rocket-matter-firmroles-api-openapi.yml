              $ref: '#/components/schemas/GetClientRoleRatesRequest'
        required: true
      summary: Get client role rates
      x-summary-source: derived
  /FirmRoles.svc/json/SaveClientRoleRates:
    post:
      tags:
      - FirmRoles
      description: Saves client role rates based on list of client role rates. Requires admin access and is an admin user.
      operationId: SaveClientRoleRates
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveClientRoleRatesResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveClientRoleRatesRequest'
        required: true
      summary: Save client role rates
      x-summary-source: derived
