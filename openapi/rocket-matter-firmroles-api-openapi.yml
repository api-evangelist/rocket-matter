servers:
- url: https://<DOMAIN>/<INSTALL>/API_V2
tags:
- name: FirmRoles
paths:
  /FirmRoles.svc/json/GetFirmRoles:
    post:
      tags:
      - FirmRoles
      description: Retrieves firm roles for users. Requires admin access and is an admin user.
      operationId: GetFirmRoles
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFirmRolesResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetFirmRolesRequest'
        required: true
      summary: Get firm roles
      x-summary-source: derived
  /FirmRoles.svc/json/SaveFirmRoles:
    post:
      tags:
      - FirmRoles
      description: Saves firm roles for users. Requires admin access and is an admin user.
      operationId: SaveFirmRoles
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFirmRolesResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetFirmRolesRequest'
        required: true
      summary: Save firm roles
      x-summary-source: derived
  /FirmRoles.svc/json/SaveFirmRole:
    post:
      tags:
      - FirmRoles
      description: Saves firm roles for users. Requires admin access and is an admin user.
