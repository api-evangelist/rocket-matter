components:
  schemas:
    SurchargeRate:
      type: object
      properties:
        Id:
          type: string
        Description:
          type: string
        Rate:
          type: number
          format: double
        SurchargeRateType:
          type: string
          enum:
          - FeesAndExpenses
          - FeesAndSelectedExpenses
          - Expenses
          - SelectedExpenses
          - SelectedFees
          - SelectedFeesAndSelectedExpenses
          - Fees
          - ExpensesAndSelectedFees
        AppliedToMatter:
          type: boolean
        ActivityType:
          type: string
          enum:
          - None
          - Activity
          - Timer
          - TodoItem
          - CalendarEntry
          - Expense
          - BilledTime
          - PhoneMessage
          - Document
          - Note
          - Email
          - FlatFee
    GetMatterBudgetRequest:
      type: object
      properties:
        MatterId:
          type: integer
          format: int32
    GetMatterEmailFoldersResponse:
      type: object
      properties:
        EmailFolders:
          type: array
          items:
            type: string
        EmailIntegrationSetup:
          type: boolean
        Success:
          type: boolean
        Message:
          type: string
        ErrorMessage:
          type: string
        ErrorNumber:
          type: integer
          format: int32
        FailedValidations:
          type: array
