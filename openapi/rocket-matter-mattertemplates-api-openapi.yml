openapi: 3.2.0
info:
  description: Welcome to the Rocket Matter API.
  version: '2.0'
  title: Rocket Matter Matter Templates API
  termsOfService: www.rocketmatter.com
  contact:
    email: developer@rocketmatter.com
  license:
    name: Rocket Matter
    url: www.rocketmatter.com
  x-logo:
    url: https://support.rocketmatter.com/wp-content/themes/rm-support/img/rm-logo.png
servers:
- url: https://<DOMAIN>/<INSTALL>/API_V2
tags:
- name: MatterTemplates
  description: Manage creating, editing and deleting matter templates.
paths:
  /MatterTemplates.svc/json/Exists:
    post:
      tags:
      - MatterTemplates
      description: Checks if the matter template name already exists.
      operationId: Exists
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterTemplateExistsResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatterTemplateExistsRequest'
        required: true
      summary: Exists
      x-summary-source: derived
  /MatterTemplates.svc/json/GetFutureDate:
    post:
      tags:
      - MatterTemplates
      description: 'Calculates the date in the future bases on the time period and amount of units, after specific date or after

        specific business days.'
      operationId: GetFutureDate
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFutureDateResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetFutureDateRequest'
        required: true
      summary: Get future date
      x-summary-source: derived
  /MatterTemplates.svc/json/GetAll:
    post:
      tags:
      - MatterTemplates
      description: Gets all matter templates for the firm including their tasks and events details.
      operationId: GetAll
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterTemplatesGetAllResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      summary: Get all
      x-summary-source: derived
  /MatterTemplates.svc/json/GetAllBase:
    post:
      tags:
      - MatterTemplates
      description: Gets all matter templates for the firm only including base information such as name, description and number of tasks or events. This doesn't retrieve the event or task details.
      operationId: GetAllBase
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterTemplatesGetAllResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      summary: Get all base
      x-summary-source: derived
  /MatterTemplates.svc/json/Save:
    post:
      tags:
      - MatterTemplates
      description: Saves the matter template, if the template is passed with an Id, it does an update on the matter template with that Id, otherwise it will create a new template.
      operationId: Save
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterTemplateSaveResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatterTemplateSaveRequest'
        required: true
      summary: Save
      x-summary-source: derived
  /MatterTemplates.svc/json/GetNewMatterFromTemplate:
    post:
      tags:
      - MatterTemplates
      description: Returns a blank matter build from the matter template Id specified, the matter will not be saved, just built and sent back. The user would have to save the matter by calling the Save method on the matter endpoint.
      operationId: GetNewMatterFromTemplate
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetNewMatterFromTemplateResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetNewMatterFromTemplateRequest'
        required: true
      summary: Get new matter from template
      x-summary-source: derived
  /MatterTemplates.svc/json/Get:
    post:
      tags:
      - MatterTemplates
      description: 'Calculates the date in the future bases on the time period and amount of units, after specific date or after

        specific business days.'
      operationId: Get
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMatterTemplateResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetMatterTemplateRequest'
        required: true
      summary: Get
      x-summary-source: derived
  /MatterTemplates.svc/json/Delete:
    post:
      tags:
      - MatterTemplates
      description: Deletes the matter template by Id.
      operationId: Delete
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMatterTemplateResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteMatterTemplateRequest'
        required: true
      summary: Delete
      x-summary-source: derived
  /MatterTemplates.svc/json/GetSortedTaskAndEventSummary:
    post:
      tags:
      - MatterTemplates
      description: Gets the summary of tasks and events sorted by the date they occur relative to their milestones.
      operationId: GetSortedTaskAndEventSummary
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSortedTaskAndEventSummaryInfoResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetSortedTaskAndEventSummaryInfoRequest'
        required: true
      summary: Get sorted task and event summary
      x-summary-source: derived
  /MatterTemplates.svc/json/GetMilestonesForItem:
    post:
      tags:
      - MatterTemplates
      description: Gets the available milestones that the given task or event can be based on.
      operationId: GetMilestonesForItem
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMilestoneForItemResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetMilestonesForItemRequest'
        required: true
      summary: Get milestones for item
      x-summary-source: derived
  /MatterTemplates.svc/json/GetDefaultMatterTemplateRoles:
    post:
      tags:
      - MatterTemplates
      description: Gets the system defined matter roles that can be used with the template.
      operationId: GetDefaultMatterTemplateRoles
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDefaultMatterTemplateRolesResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      summary: Get default matter template roles
      x-summary-source: derived
