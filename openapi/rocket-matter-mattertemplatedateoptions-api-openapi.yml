          type: string
    GetMatterTemplateDateOptionDetailsResponse:
      type: object
      properties:
        TaskDateOptions:
          type: array
          items:
            $ref: '#/components/schemas/MatterTemplateDateOption'
        EventDateOptions:
          type: array
          items:
            $ref: '#/components/schemas/MatterTemplateDateOption'
        MatterDetailDateOptions:
          type: array
          items:
            $ref: '#/components/schemas/MatterTemplateDateOption'
        MilestoneOrders:
          type: array
