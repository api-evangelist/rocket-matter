        Precision:
          type: boolean
        ValueEntered:
          type: object
        Name:
          type: string
        ObjectName:
          type: string
        ExternalID:
          type: string
        MinValueMessage:
          type: string
        MaxValueMessage:
          type: string
        MinLengthMessage:
          type: string
        MaxLengthMessage:
          type: string
        RequiredMessage:
          type: string
        RequiredPrecisionMessage:
          type: string
        BaseFailureMessage:
          type: string
        FailedValidationMessages:
          type: array
          items:
            type: string
        FailedCharacterValidations:
          type: array
          items:
            $ref: '#/components/schemas/CharacterValidationRule'
        IsValid:
          type: boolean
    MatterTemplateDateOptionsGetByDisplayGroupResponse:
      type: object
      properties:
        MatterTemplateDateOptions:
          type: array
          items:
            $ref: '#/components/schemas/MatterTemplateDateOption'
        Success:
          type: boolean
        Message:
          type: string
        ErrorMessage:
          type: string
        ErrorNumber:
          type: integer
          format: int32
        FailedValidations:
          type: array
          items:
            $ref: '#/components/schemas/ValidationResult'
        Errors:
          type: array
          items:
            type: string
    MatterTemplateDateOption:
      type: object
      properties:
        Name:
          type: string
        ID:
          type: integer
          format: int32
    MatterTemplateDateOptionsGetResponse:
      type: object
      properties:
        MatterTemplateDateOptions:
          type: array
          items:
            $ref: '#/components/schemas/MatterTemplateDateOption'
        Success:
          type: boolean
        Message:
          type: string
        ErrorMessage:
