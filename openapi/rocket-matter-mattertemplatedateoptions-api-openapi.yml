openapi: 3.2.0
info:
  description: Welcome to the Rocket Matter API.
  version: '2.0'
  title: Rocket Matter Matter Template Date Options API
  termsOfService: www.rocketmatter.com
  contact:
    email: developer@rocketmatter.com
  license:
    name: Rocket Matter
    url: www.rocketmatter.com
  x-logo:
    url: https://support.rocketmatter.com/wp-content/themes/rm-support/img/rm-logo.png
servers:
- url: https://<DOMAIN>/<INSTALL>/API_V2
tags:
- name: MatterTemplateDateOptions
  description: Manages the date options for a matter template.
paths:
  /MatterTemplateDateOptions.svc/json/GetAll:
    post:
      tags:
      - MatterTemplateDateOptions
      description: Gets all available date options.
      operationId: GetAll
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterTemplateDateOptionsGetResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      summary: Get all
      x-summary-source: derived
  /MatterTemplateDateOptions.svc/json/GetByGroup:
    post:
      tags:
      - MatterTemplateDateOptions
      description: Gets the available date options for any of the following 'Event', 'Task', 'MatterDetail'.
      operationId: GetByGroup
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterTemplateDateOptionsGetByDisplayGroupResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatterTemplateDateOptionsGetByDisplayGroupRequest'
        required: true
      summary: Get by group
      x-summary-source: derived
  /MatterTemplateDateOptions.svc/json/GetMatterTemplateDateOptionDetails:
    post:
      tags:
      - MatterTemplateDateOptions
      description: Gets all date options grouped by the different types of actions.
      operationId: GetMatterTemplateDateOptionDetails
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMatterTemplateDateOptionDetailsResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      summary: Get matter template date option details
      x-summary-source: derived
  /MatterTemplateDateOptions.svc/json/Get:
    post:
      tags:
      - MatterTemplateDateOptions
      description: Gets all available date options.
      operationId: Get
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterTemplateDateOptionGetResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatterTemplateDateOptionGetRequest'
        required: true
      summary: Get
      x-summary-source: derived
components:
  schemas:
    MatterTemplateDateOptionGetResponse:
      type: object
      properties:
        MatterTemplateDateOption:
          type: object
          $ref: '#/components/schemas/MatterTemplateDateOption'
        Success:
          type: boolean
        Message:
          type: string
        ErrorMessage:
          type: string
        ErrorNumber:
          type: integer
          format: int32
        FailedValidations:
          type: array
          items:
            $ref: '#/components/schemas/ValidationResult'
        Errors:
          type: array
          items:
            type: string
    CharacterValidationRule:
      type: object
      properties:
        ShouldMatch:
          type: boolean
        Message:
          type: string
        Regex:
          type: string
    MatterTemplateDateOptionGetRequest:
      type: object
