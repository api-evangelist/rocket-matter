openapi: 3.2.0
info:
  description: Welcome to the Rocket Matter API.
  version: '2.0'
  title: Rocket Matter Matter Template Milestone Actions API
  termsOfService: www.rocketmatter.com
  contact:
    email: developer@rocketmatter.com
  license:
    name: Rocket Matter
    url: www.rocketmatter.com
  x-logo:
    url: https://support.rocketmatter.com/wp-content/themes/rm-support/img/rm-logo.png
servers:
- url: https://<DOMAIN>/<INSTALL>/API_V2
tags:
- name: MatterTemplateMilestoneActions
  description: Handles cascading milestone dependencies with tasks and events created from matter templates.
paths:
  /MatterTemplateMilestoneActions.svc/json/GetActionForItem:
    post:
      tags:
      - MatterTemplateMilestoneActions
      description: Retrieves the milestone dependency, if any, that the event or task has to another event/task. If it has no dependency the ActionItem will be null.
      operationId: GetActionForItem
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetActionForItemResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetActionForItemRequest'
        required: true
      summary: Get action for item
      x-summary-source: derived
  /MatterTemplateMilestoneActions.svc/json/DetachMilestoneAction:
    post:
      tags:
      - MatterTemplateMilestoneActions
      description: Removes the dependency of the task or event from the task/event that it is a dependent of.
      operationId: DetachMilestoneAction
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetachMilestoneActionResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetachMilestoneActionRequest'
        required: true
      summary: Detach milestone action
      x-summary-source: derived
  /MatterTemplateMilestoneActions.svc/json/CheckMilestoneUpdateStatus:
    post:
      tags:
      - MatterTemplateMilestoneActions
      description: Check if the event or task dates can be changed based on any dependency it may have. If the task/event is dependent on another task/event, it cannot be updated and CanUpdate will return false. If the task/event has child dependencies based on its date, CanUpdate will also return false and Items will contain all the child dependencies of the given task/event.
      operationId: CheckMilestoneUpdateStatus
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckMilestoneUpdateStatusResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckMilestoneUpdateStatusRequest'
        required: true
      summary: Check milestone update status
      x-summary-source: derived
  /MatterTemplateMilestoneActions.svc/json/RemoveChildMilestoneActionItems:
    post:
      tags:
      - MatterTemplateMilestoneActions
      description: Disassociates all child dependencies from the task or event.
      operationId: RemoveChildMilestoneActionItems
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveChildMilestoneActionItemsResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveChildMilestoneActionItemsRequest'
        required: true
      summary: Remove child milestone action items
      x-summary-source: derived
  /MatterTemplateMilestoneActions.svc/json/UpdateChildMilestoneDates:
    post:
      tags:
      - MatterTemplateMilestoneActions
      description: Updates all child dependencies by cascading the change in the date of the task or event down to all dependencies.
      operationId: UpdateChildMilestoneDates
      responses:
        '200':
          description: Successfully processed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateChildMilestoneDatesResponse'
        '400':
          description: Internal server error
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChildMilestoneDatesRequest'
        required: true
      summary: Update child milestone dates
      x-summary-source: derived
